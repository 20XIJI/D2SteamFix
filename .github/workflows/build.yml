name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      # The project builds with /W4 /WX, so a warning fails this step.
      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel

      - name: Upload steamfix.exe
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: steamfix
          path: |
            build/Release/steamfix.exe
            build/Release/steamfix.pdb
          if-no-files-found: error
