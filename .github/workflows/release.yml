name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: >
          gh release create "$env:TAG"
          build/Release/steamfix.exe
          build/Release/steamfix.pdb
          --title "$env:TAG"
          --generate-notes
