name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify release version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          $version = [regex]::Match($project, 'project\(D2SteamFix VERSION (\d+\.\d+\.\d+)\b')
          if (-not $version.Success -or $env:TAG -cne "v$($version.Groups[1].Value)") {
            throw "Release tag ($env:TAG) must match the CMake project version (vX.Y.Z)."
          }

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: >
          gh release create "$env:TAG"
          build/Release/steamfix.exe
          build/Release/steamfix.pdb
          --title "$env:TAG"
          --generate-notes
